openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversations
    description: Authenticated conversation and message operations
  - name: memories
    description: Authenticated long-term memory operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List the authenticated user's conversations
      responses:
        "200":
          description: Conversations owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a conversation for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid conversation input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      tags: [conversations]
      summary: List messages for an owned conversation
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Messages in the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendConversationMessage
      tags: [conversations]
      summary: Store a user message and generate a Gemini response
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Stored user and Gemini-generated model messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageExchange"
        "400":
          description: Invalid message input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Gemini provider failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Gemini configuration or availability failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "504":
          description: Gemini request timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List the authenticated user's memories
      responses:
        "200":
          description: Memories owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a memory for the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created and indexed memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "400":
          description: Invalid memory input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Memory provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /memories/{memoryId}:
    get:
      operationId: getMemory
      tags: [memories]
      summary: Get an owned memory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "200":
          description: Owned memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateMemory
      tags: [memories]
      summary: Update and re-index an owned memory
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdate"
      responses:
        "200":
          description: Updated and indexed memory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "400":
          description: Invalid memory update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Memory provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete an owned memory and its vector
      parameters:
        - $ref: "#/components/parameters/MemoryId"
      responses:
        "204":
          description: Memory deleted
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Memory not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Memory provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    MemoryId:
      name: memoryId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Conversation:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - title
        - createdAt
        - updatedAt
    ConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
      required:
        - title
    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [user, model]
        text:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - userId
        - role
        - text
        - timestamp
    MessageInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4000
      required:
        - text
    MessageExchange:
      type: object
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        assistantMessage:
          $ref: "#/components/schemas/Message"
      required:
        - userMessage
        - assistantMessage
    MemoryType:
      type: string
      enum: [preference, interest, goal, fact, instruction, context]
    MemoryIndexStatus:
      type: string
      enum: [pending, indexed, failed]
    Memory:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        type:
          $ref: "#/components/schemas/MemoryType"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sourceConversationId:
          type: string
        sourceMessageId:
          type: string
        vectorStatus:
          $ref: "#/components/schemas/MemoryIndexStatus"
      required:
        - id
        - text
        - type
        - createdAt
        - updatedAt
        - sourceConversationId
        - sourceMessageId
        - vectorStatus
    MemoryInput:
      type: object
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 500
        type:
          $ref: "#/components/schemas/MemoryType"
      required:
        - text
        - type
    MemoryUpdate:
      type: object
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 500
        type:
          $ref: "#/components/schemas/MemoryType"
      minProperties: 1

